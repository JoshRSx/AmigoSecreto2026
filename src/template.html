<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto Familiar 🎄</title>

<style>
:root{
  --rojo:#c8102e; --rojo2:#8e0c20; --verde:#0f5132; --verde2:#1e7d4f;
  --oro:#f4c430; --oro2:#d9a400; --crema:#fff8ec; --tinta:#2b1d14; --gris:#7a6a5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--tinta);
  background:radial-gradient(120% 80% at 50% 0%,#14603f 0%,#0b3d2a 45%,#06261a 100%) fixed;
  min-height:100vh;padding-bottom:40px;
}
#nieve{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 14px 30px}
.guirnalda{display:block;width:100%;height:46px;margin-bottom:4px}
h1,h2,.fest{font-family:'Mountains of Christmas',Georgia,serif}
.hero{text-align:center;color:#fff;padding:4px 0 10px}
.hero svg{width:120px;height:120px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.hero h1{font-size:46px;line-height:1;margin:6px 0 0;color:var(--oro);text-shadow:0 3px 0 var(--rojo2),0 6px 14px rgba(0,0,0,.4)}
.hero .sub{margin:4px 0 0;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;opacity:.9}
.card{
  background:var(--crema);border-radius:20px;padding:18px 16px;margin:14px 0;
  box-shadow:0 10px 26px rgba(0,0,0,.28);position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;
  background:repeating-linear-gradient(45deg,var(--rojo) 0 12px,#fff 12px 24px)}
.card h2{font-size:30px;margin:6px 0 10px;color:var(--rojo);line-height:1.05}
.card h2.peq{font-family:'Nunito',system-ui,sans-serif;font-size:19px;font-weight:800;color:var(--tinta);line-height:1.35}
.banner{background:var(--oro);color:var(--tinta);border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;text-align:center;margin:10px 0}
.nombres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nombre{
  font:800 17px 'Nunito',system-ui,sans-serif;padding:14px 10px;border-radius:14px;border:2px solid #ead9bf;
  background:#fff;color:var(--tinta);display:flex;align-items:center;gap:8px;cursor:pointer;
}
.nombre:active,.nombre.sel{border-color:var(--rojo);background:#ffecec}
.nombre .emo{font-size:22px}
.btn{
  font:900 17px 'Nunito',system-ui,sans-serif;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;
  background:var(--rojo);color:#fff;box-shadow:0 4px 0 var(--rojo2);width:100%;
  transition:transform .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rojo2)}
.btn.verde{background:var(--verde2);box-shadow:0 4px 0 var(--verde)}
.btn.oro{background:var(--oro);color:var(--tinta);box-shadow:0 4px 0 var(--oro2)}
.btn.sec{background:#fff;color:var(--tinta);border:2px solid #ead9bf;box-shadow:none}
.btn.chico{width:auto;padding:10px 14px;font-size:15px}
.btn:disabled{opacity:.45}
.enlace{text-align:center;margin:18px 0}
.enlace a,.link{color:#fff;font-weight:800;text-decoration:underline;background:none;border:0;font-size:15px;cursor:pointer;font-family:inherit}
.link.osc{color:var(--gris)}
.topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800}
.topbar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:800 15px 'Nunito',system-ui,sans-serif;cursor:pointer}
.saludo{color:#fff;text-align:center;margin:6px 0 0}
.saludo h1{font-size:40px;margin:0;color:var(--oro);text-shadow:0 3px 0 var(--rojo2)}
.juego-tit{font-weight:900;color:var(--verde2);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.desc{margin:4px 0 0;color:var(--gris)}
.ronda{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;margin:10px 0;background:#fff;border:2px solid #f0e2cb}
.ronda.bloq{opacity:.55}
.ronda.hecha{border-color:#bfe3cc;background:#f2fbf5}
.ronda-num{font-size:30px;width:40px;text-align:center}
.ronda-txt{flex:1}
.ronda-txt small{display:block;color:var(--gris);font-weight:700}
.pista{margin-top:6px;font-weight:800;color:var(--verde);font-size:16px}
.reto h2{font-family:'Nunito',system-ui,sans-serif;font-size:20px;font-weight:800;color:var(--tinta);line-height:1.35}
.emojis{font-size:48px;text-align:center;margin:14px 0;letter-spacing:4px}
.letras,.codigo{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0}
.letras span{width:40px;height:46px;display:grid;place-items:center;background:var(--verde2);color:#fff;font:900 22px 'Nunito',system-ui,sans-serif;border-radius:10px;box-shadow:0 3px 0 var(--verde)}
.codigo span{font-size:36px}
.codigo.txt{font:900 22px 'Nunito',system-ui,sans-serif;color:var(--rojo);letter-spacing:.05em}
.serie{text-align:center;font:900 28px 'Nunito',system-ui,sans-serif;color:var(--verde2);margin:16px 0}
.tabla{border-collapse:collapse;margin:10px auto;background:#fff;border-radius:12px;overflow:hidden}
.tabla th,.tabla td{border:1px solid #ead9bf;padding:6px 12px;text-align:center;font-size:17px}
.tabla th{background:#fbefd9}
.tabla .emo{font-size:24px}
.tabla.coord td{font:900 20px 'Nunito',system-ui,sans-serif;width:42px;height:42px}
.ops{font:800 20px 'Nunito',system-ui,sans-serif;padding-left:26px}
.ops li{margin:6px 0}
.hueco{display:inline-block;min-width:28px;border-bottom:3px dotted var(--rojo);text-align:center;color:var(--rojo)}
.abc summary{cursor:pointer;color:var(--verde2);font-weight:800;margin:6px 0}
.abc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:13px}
.abc-grid span{background:#fff;border-radius:6px;padding:3px;text-align:center}
.abc-grid b{display:block;font-size:15px}
.lista{padding-left:20px;font-size:17px;line-height:1.5}
.nota{color:var(--gris);font-size:14px;font-weight:700;margin:6px 0}
.resp{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.resp input,textarea,select{
  font:800 19px 'Nunito',system-ui,sans-serif;padding:14px;border-radius:14px;border:2px solid #ead9bf;background:#fff;width:100%;color:var(--tinta)
}
textarea{font-size:16px;font-weight:700;min-height:70px;resize:vertical}
.resp input:focus,textarea:focus,select:focus{outline:none;border-color:var(--verde2)}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opcion{font:900 18px 'Nunito',system-ui,sans-serif;padding:16px 10px;border-radius:14px;border:2px solid #ead9bf;background:#fff;cursor:pointer;color:var(--tinta)}
.opcion.mal{background:#ffe1e1;border-color:#f3a3a3;opacity:.6}
.opcion.bien{background:#d9f3e2;border-color:var(--verde2)}
.ayuda-btn{margin-top:14px;background:none;border:2px dashed #e0c99f;border-radius:12px;padding:10px;width:100%;font:800 15px 'Nunito',system-ui,sans-serif;color:var(--gris);cursor:pointer}
.ayuda{background:#fff6d6;border-radius:12px;padding:10px 12px;font-weight:700;margin:10px 0 0}
.sacudir{animation:sacudir .4s}
@keyframes sacudir{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:20;transition:transform .25s;max-width:90vw;text-align:center}
#toast.ver{transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:20px}
#modal[hidden]{display:none}
.modal-caja{background:var(--crema);border-radius:20px;padding:20px;max-width:380px;width:100%;text-align:center;font-size:17px}
.modal-caja h3{font-family:'Mountains of Christmas',Georgia,serif;font-size:30px;color:var(--rojo);margin:0 0 8px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
/* Sopa */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{background:#fff;border:2px solid #ead9bf;border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
.chip.ok{background:var(--verde2);color:#fff;border-color:var(--verde2);text-decoration:line-through}
.sopa{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;touch-action:manipulation}
.celda{aspect-ratio:1;border:0;border-radius:7px;background:#fff;font:900 clamp(13px,4.2vw,19px) 'Nunito',system-ui,sans-serif;color:var(--tinta);padding:0;cursor:pointer}
.celda.sel{background:var(--oro)}
.celda.ok{background:#bfe8cf;color:var(--verde)}
.celda.err{background:#ffc9c9}
.letras.chicas span{width:32px;height:40px;font-size:19px}
.huecos{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:-4px 0 6px}
.huecos span{width:32px;text-align:center;font:900 22px 'Nunito',system-ui,sans-serif;color:#cdbfa8;border-bottom:3px solid #e0cfae}
.huecos span.ok{color:var(--rojo);border-color:var(--rojo)}
.celda.pista{background:var(--oro);animation:latido .8s infinite}
/* Memoria */
.memoria{display:grid;gap:10px;margin-top:12px}
.carta{aspect-ratio:3/4;border:0;border-radius:14px;cursor:pointer;font-size:40px;position:relative;perspective:600px;background:none;padding:0}
.carta .cara{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .35s}
.carta .frente{background:#fff;border:3px solid var(--oro);transform:rotateY(180deg)}
.carta .dorso{background:repeating-linear-gradient(45deg,var(--rojo) 0 10px,var(--rojo2) 10px 20px);border:3px solid var(--oro);font-size:28px}
.carta.vuelta .frente{transform:rotateY(0)}
.carta.vuelta .dorso{transform:rotateY(-180deg)}
.carta.par .frente{background:#d9f3e2;border-color:var(--verde2)}
.cuenta{text-align:center;font:900 22px 'Nunito',system-ui,sans-serif;color:var(--rojo);min-height:30px}
/* Diferencias */
.escena{width:100%;display:block;border-radius:14px;border:3px solid var(--oro)}
.dif-lbl{font-weight:900;font-size:14px;color:var(--gris);margin:10px 0 4px;display:flex;justify-content:space-between}
.dif-zona{position:relative}
/* Candado */
.candado{display:flex;justify-content:center;margin:6px 0}
.candado svg{width:90px;height:100px}
.candado .arco{transition:transform .5s}
.candado.abierto .arco{transform:translateY(-14px)}
.diales{display:flex;justify-content:center;gap:10px;margin:12px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{width:56px;height:38px;border:0;border-radius:10px;background:var(--verde2);color:#fff;font-size:18px;cursor:pointer}
.dial span{width:56px;height:62px;display:grid;place-items:center;background:#fff;border:3px solid var(--oro);border-radius:12px;font:900 34px 'Nunito',system-ui,sans-serif}
/* Ruleta */
.ruleta-box{position:relative;width:260px;height:260px;margin:10px auto}
.ruleta-box svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.15,.85,.2,1)}
.puntero{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--oro);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:2}
.cat{text-align:center;font:900 20px 'Nunito',system-ui,sans-serif;color:var(--verde2);margin:6px 0}
/* Regalo */
.regalo-btn{background:none;border:0;cursor:pointer;display:block;margin:10px auto;padding:0}
.regalo-svg{width:170px;height:170px;overflow:visible}
.regalo-svg .tapa{transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:20% 100%}
.regalo-btn.abierto .tapa{transform:translate(34px,-14px) rotate(24deg)}
.regalo-btn:not(.abierto) .regalo-svg{animation:latido 1.4s infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06) rotate(-2deg)}}
.pista-grande{font:900 24px 'Nunito',system-ui,sans-serif;color:var(--verde);text-align:center;margin:10px 0;opacity:0;transform:translateY(10px);transition:all .5s .3s}
.pista-grande.ver{opacity:1;transform:none}
.centro{text-align:center}
.final-nombre{font-family:'Mountains of Christmas',Georgia,serif;font-size:64px;color:var(--rojo);line-height:1;margin:10px 0;text-shadow:0 3px 0 var(--oro)}
.tiempo{font:900 18px 'Nunito',system-ui,sans-serif;color:var(--verde2)}
.estado{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-weight:700;font-size:15px;align-items:center}
.estado .h{font-weight:900;color:var(--gris);font-size:12px;text-transform:uppercase}
.err-lista{color:var(--rojo);font-weight:800;font-size:14px}
.campo{margin:12px 0}
.campo label{display:block;font-weight:900;margin-bottom:6px}
.campo small{display:block;color:var(--gris);font-weight:700;margin-top:4px}
.salida{font:700 12px monospace;min-height:110px;word-break:break-all}
.fila{display:flex;gap:10px;margin-top:10px}
.nombre[data-ocupado]{opacity:.6}
.nombre .est{margin-left:auto;font-size:15px}
.tragamonedas{font-family:'Mountains of Christmas',Georgia,serif;font-size:52px;color:var(--rojo);height:84px;display:grid;place-items:center;border:4px solid var(--oro);border-radius:18px;background:#fff;margin:14px 0;overflow:hidden;box-shadow:inset 0 6px 10px rgba(0,0,0,.08)}
.final-nombre.oculto{filter:blur(14px);user-select:none}
.final-nombre{transition:filter .3s}
.tabla-admin{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tabla-admin th{text-align:left;color:var(--gris);font-size:12px;text-transform:uppercase;padding:6px 4px;border-bottom:2px solid #ead9bf}
.tabla-admin td{padding:8px 4px;border-bottom:1px solid #f0e2cb;vertical-align:middle}
.tabla-admin small{color:var(--gris)}
.tabla-admin .link{font-size:22px;text-decoration:none}
.fila .btn.chico{flex:1}
  .pista-grande.frase{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:22px;line-height:1.35;color:var(--verde)}
.pista-grande.frase small{font-family:'Nunito',system-ui,sans-serif;font-weight:700;display:block;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.kpi{border:2px solid #ead9bf;background:#fff;border-radius:12px;padding:8px 2px;cursor:pointer;font-family:'Nunito',system-ui,sans-serif;color:var(--tinta)}
.kpi b{display:block;font-size:22px;font-weight:900}
.kpi span{font-size:11px;font-weight:800;color:var(--gris);text-transform:uppercase}
.kpi.act{border-color:var(--rojo);background:#ffecec}
.barra-total{height:10px;background:#f0e2cb;border-radius:99px;overflow:hidden}
.barra-total div{height:100%;background:linear-gradient(90deg,var(--verde2),var(--oro));border-radius:99px;transition:width .4s}
.card.jug{padding:14px 14px 12px;margin:10px 0}
.card.jug::before{height:5px}
.jug-top{display:flex;justify-content:space-between;align-items:center}
.jug-nom{font-size:18px;display:flex;align-items:center;gap:6px}
.punto{width:10px;height:10px;border-radius:50%;background:#cdbfa8;display:inline-block}
.punto.on{background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25)}
.menu{font-size:26px!important;text-decoration:none!important;padding:0 6px}
.estado-tag{display:inline-block;margin:6px 0;padding:4px 10px;border-radius:99px;font-weight:900;font-size:14px;background:#eee}
.estado-tag.ok{background:#d9f3e2;color:var(--verde)}
.estado-tag.oro{background:#fff1c2;color:#7a5a00}
.estado-tag.juega{background:#dbeafe;color:#1e40af}
.estado-tag.entro{background:#f3e8ff;color:#6b21a8}

.pasos{display:flex;gap:5px;margin:4px 0 8px}
.pasos span{flex:1;height:8px;border-radius:99px;background:#f0e2cb}
.pasos span.hecho{background:var(--verde2)}
.pasos span.actual{background:var(--oro);animation:latido 1.2s infinite}
.jug-datos{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-weight:700;color:var(--gris)}
.jug-amigo{margin-top:8px;font-size:15px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<script>
const DATA = /*__DATA__*/null;

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const NOMBRES = DATA.participantes.map(p => p.nombre);
const participante = n => DATA.participantes.find(p => p.nombre === n);
const TIPOS_PISTA = ['Una característica general', 'Un gusto o afición', 'Una pista más específica'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const KEY = new TextEncoder().encode('navidad-2026');
const xor = b => b.map((x, i) => x ^ KEY[i % KEY.length]);
function enc(str) { const b = xor(new TextEncoder().encode(String(str))); let s = ''; b.forEach(x => s += String.fromCharCode(x)); return btoa(s); }
function dec(b64) { const s = atob(b64); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(xor(b)); }
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim()
  .replace(/^(el|la|los|las|un|una)\s+/, '').replace(/[^a-z0-9]/g, '');

const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) { } return k in mem ? mem[k] : null; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { } },
};

function toast(t, ms = 1800) { const el = $('#toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('ver'), ms); }
function modal(html, botones) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="modal-caja">${html}<div class="modal-btns">${botones.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
    m.hidden = false;
    m.onclick = e => { const b = e.target.closest('[data-i]'); if (b) { m.hidden = true; res(+b.dataset.i); } };
  });
}
function fiesta(grande) {
  if (!window.confetti) return;
  const colors = ['#c8102e', '#f4c430', '#1e7d4f', '#ffffff'];
  confetti({ particleCount: grande ? 180 : 110, spread: grande ? 110 : 75, origin: { y: .65 }, colors });
  if (grande) { setTimeout(() => confetti({ particleCount: 90, angle: 60, spread: 60, origin: { x: 0 }, colors }), 250); setTimeout(() => confetti({ particleCount: 90, angle: 120, spread: 60, origin: { x: 1 }, colors }), 450); }
}
let actx;
function sonido(tipo) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notas = tipo === 'mal' ? [220, 180] : tipo === 'final' ? [523, 659, 784, 1047, 784, 1047] : [659, 784, 1047];
    notas.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = tipo === 'mal' ? 'square' : 'triangle'; o.frequency.value = f;

function generarSopa(palabras, N, semilla) {
  const r = rng(semilla), dirs = [[0, 1], [1, 0], [1, 1], [-1, 1]];
  const relleno = 'ABCDEFGHIJLMNOPRSTUVZ';
  for (let intento = 0; intento < 200; intento++) {
    const g = Array.from({ length: N }, () => Array(N).fill(''));
    let ok = true;
    for (const w of [...palabras].sort((a, b) => b.length - a.length)) {
      let puesto = false;
      for (let t = 0; t < 400 && !puesto; t++) {
        const [dr, dc] = dirs[Math.floor(r() * dirs.length)];
        const r0 = Math.floor(r() * N), c0 = Math.floor(r() * N);
        const rf = r0 + dr * (w.length - 1), cf = c0 + dc * (w.length - 1);
        if (rf < 0 || rf >= N || cf < 0 || cf >= N) continue;
        let cabe = true;
        for (let k = 0; k < w.length; k++) { const ch = g[r0 + dr * k][c0 + dc * k]; if (ch && ch !== w[k]) { cabe = false; break; } }
        if (!cabe) continue;
        for (let k = 0; k < w.length; k++) g[r0 + dr * k][c0 + dc * k] = w[k];
        puesto = true;
      }
      if (!puesto) { ok = false; break; }
    }
    if (ok) { for (const fila of g) for (let c = 0; c < N; c++) if (!fila[c]) fila[c] = relleno[Math.floor(r() * relleno.length)]; return g; }
  }
  throw new Error('No se pudo generar la sopa');
}

RENDER.sopa = (z, n, ganar) => {
  const g = generarSopa(n.palabras, n.tam, n.semilla);
  const faltan = new Set(n.palabras); let sel = null;
  z.innerHTML = `<p class="nota">Toca la <b>primera</b> y la <b>última</b> letra de cada palabra.</p>

    <div class="sopa" style="--n:${n.tam}">${g.map((fila, r) => fila.map((ch, c) => `<button class="celda" data-r="${r}" data-c="${c}">${ch}</button>`).join('')).join('')}</div>`;

    if (!sel) { sel = [r, c]; b.classList.add('sel'); return; }
    const [r0, c0] = sel; celda(r0, c0).classList.remove('sel'); sel = null;
    if (r0 === r && c0 === c) return;
    const dr = Math.sign(r - r0), dc = Math.sign(c - c0), len = Math.max(Math.abs(r - r0), Math.abs(c - c0)) + 1;
    const recta = r0 === r || c0 === c || Math.abs(r - r0) === Math.abs(c - c0);
    let celdas = [], txt = '';
    if (recta) for (let k = 0; k < len; k++) { celdas.push(celda(r0 + dr * k, c0 + dc * k)); txt += g[r0 + dr * k][c0 + dc * k]; }
    const inv = [...txt].reverse().join('');
    const w = [...faltan].find(x => x === txt || x === inv);
    if (w) {
      faltan.delete(w); celdas.forEach(e => e.classList.add('ok')); $(`.chip[data-w="${w}"]`, z).classList.add('ok'); sonido('bien');

      let t = ''; for (let k = 0; k < w.length; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || cc < 0 || rr >= N || cc >= N) break; t += g[rr][cc]; }

    }

  z.innerHTML = `<div class="letras ${cifra.length > 7 ? 'chicas' : ''}">${cifra.map(c => `<span>${c}</span>`).join('')}</div>
    <div class="huecos" id="huecos">${cifra.map(() => '<span>_</span>').join('')}</div>
    <form class="resp"><input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe el nombre" required><button class="btn">Comprobar</button></form>`;
  const f = $('form', z), inp = $('input', z);
  f.onsubmit = e => { e.preventDefault(); if (norm(inp.value) === norm(n.asignado)) { inp.blur(); ganar(); } else fallo(inp, '¡Casi! Retrocede cada letra una posición 🔐'); };
  // Cada ayuda revela una letra más
  z._ayuda = () => {
    if (reveladas < plano.length) reveladas++;
    $$('#huecos span', z).forEach((s, k) => { if (k < reveladas) { s.textContent = plano[k]; s.classList.add('ok'); } });
    if (reveladas === plano.length) toast('¡Ya tienes todas las letras! Escríbelo 👆', 2500);
  };
};

/* Ruleta */
const CATS = [['🧩', 'Adivinanza'], ['🌎', 'Cultura general'], ['➗', 'Matemática'], ['🔤', 'Descifra la palabra'], ['🔍', 'Encuentra el elemento'], ['🧠', 'Lógica']];
RENDER.ruleta = (z, n, ganar) => {
  const col = ['#c8102e', '#1e7d4f', '#f4c430', '#c8102e', '#1e7d4f', '#f4c430'];
  const p = a => { const rad = a * Math.PI / 180; return `${(100 + 95 * Math.sin(rad)).toFixed(2)} ${(100 - 95 * Math.cos(rad)).toFixed(2)}`; };
  const segs = CATS.map(([e], i) => {
    const a1 = i * 60, a2 = a1 + 60, am = (a1 + 30) * Math.PI / 180;
    return `<path d="M100 100 L${p(a1)} A95 95 0 0 1 ${p(a2)} Z" fill="${col[i]}" stroke="#fff" stroke-width="2"/><text x="${100 + 62 * Math.sin(am)}" y="${100 - 62 * Math.cos(am)}" font-size="26" text-anchor="middle" dominant-baseline="central">${e}</text>`;
  }).join('');
  z.innerHTML = `<div class="ruleta-box"><div class="puntero"></div><svg viewBox="0 0 200 200" id="rueda"><circle cx="100" cy="100" r="99" fill="#f4c430"/>${segs}<circle cx="100" cy="100" r="14" fill="#fff" stroke="#f4c430" stroke-width="4"/></svg></div>
    <button class="btn oro" id="girar">🎡 ¡Girar!</button><div id="sub"></div>`;
  let rot = 0;
  $('#girar', z).onclick = () => {
    const btn = $('#girar', z); btn.disabled = true; $('#sub', z).innerHTML = '';
    const i = Math.floor(Math.random() * 6);
    const deseado = (360 - (i * 60 + 30)) % 360, actual = rot % 360;
    rot += 1800 + (deseado - actual + 360) % 360;
    $('#rueda', z).style.transform = `rotate(${rot}deg)`;
    setTimeout(() => {
      const reto = n.retos[i];
      $('#sub', z).innerHTML = `<div class="cat">${CATS[i][0]} ${CATS[i][1]}</div><h2 class="peq">${reto.enunciado}</h2><div id="subzona"></div>${reto.ayuda ? `<button class="ayuda-btn" id="ayudaR">💡 Pedir ayuda</button><p class="ayuda" id="ayudaRT" hidden>${reto.ayuda}</p>` : ''}`;
      RENDER[reto.tipo]($('#subzona', z), reto, ganar);
      if (reto.ayuda) $('#ayudaR', z).onclick = () => { $('#ayudaRT', z).hidden = false; $('#ayudaR', z).remove(); };
      btn.textContent = '🎡 Girar otra vez'; btn.disabled = false;
      $('#sub', z).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 4200);
  };
};
